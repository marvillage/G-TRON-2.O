<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbon Footprint Estimator</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0e17; 
            color: #e0e0e0;
            text-align: center; 
            padding: 20px;
            margin: 0;
            background-image: linear-gradient(45deg, #0a0e17 25%, #0d1524 25%, #0d1524 50%, #0a0e17 50%, #0a0e17 75%, #0d1524 75%, #0d1524 100%);
            background-size: 20px 20px;
        }
        
        .container { 
            width: 80%; 
            max-width: 600px;
            margin: auto; 
            background: #111827; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0, 149, 255, 0.15), 0 0 15px rgba(0, 149, 255, 0.1);
            border: 1px solid #1e3a8a;
        }
        
        h2 {
            color: #60a5fa;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(96, 165, 250, 0.5);
            font-weight: 600;
        }
        
        label {
            display: block;
            text-align: left;
            margin-left: 5%;
            color: #93c5fd;
            font-weight: 500;
            margin-top: 15px;
        }
        
        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #3b82f6;
            background-color: #1e293b;
            color: #e0e0e0;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }
        
        input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.6);
        }
        
        input::placeholder {
            color: #64748b;
        }
        
        button {
            width: 90%;
            padding: 14px;
            margin: 25px 0 15px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.5);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.6);
            background: linear-gradient(135deg, #60a5fa, #2563eb);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        #result {
            margin-top: 25px;
            padding: 15px;
            background-color: #1e293b;
            border-radius: 8px;
            font-weight: 500;
            color: #93c5fd;
            border-left: 4px solid #3b82f6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>E-Waste Carbon Footprint Estimator</h2>

        <label>Weight (kg):</label>
        <input type="number" id="weight" placeholder="Enter weight in kg">

        <label>Plastic (%) :</label>
        <input type="number" id="plastic" placeholder="Enter plastic composition">

        <label>Aluminum (%) :</label>
        <input type="number" id="aluminum" placeholder="Enter aluminum composition">

        <label>Copper (%) :</label>
        <input type="number" id="copper" placeholder="Enter copper composition">

        <label>Lithium (%) :</label>
        <input type="number" id="lithium" placeholder="Enter lithium composition">

        <label>Gold (%) :</label>
        <input type="number" id="gold" placeholder="Enter gold composition">

        <label>Glass (%) :</label>
        <input type="number" id="glass" placeholder="Enter glass composition">

        <label>Manufacturing Energy (kWh):</label>
        <input type="number" id="energy" placeholder="Enter energy consumption in kWh">

        <label>Transport Distance (km):</label>
        <input type="number" id="distance" placeholder="Enter transport distance">

        <button onclick="predict()">Estimate Carbon Footprint</button>

        <h3 id="result">Carbon Footprint: -- kg CO₂e</h3>
    </div>

    <script>
        function predict() {
            const data = {
                Weight: parseFloat(document.getElementById("weight").value),
                Plastic: parseFloat(document.getElementById("plastic").value),
                Aluminum: parseFloat(document.getElementById("aluminum").value),
                Copper: parseFloat(document.getElementById("copper").value),
                Lithium: parseFloat(document.getElementById("lithium").value),
                Gold: parseFloat(document.getElementById("gold").value),
                Glass: parseFloat(document.getElementById("glass").value),
                "Manufacturing Energy": parseFloat(document.getElementById("energy").value),
                "Transport Distance": parseFloat(document.getElementById("distance").value),
            };

            fetch("http://127.0.0.1:5000/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                document.getElementById("result").innerText = 
                    "Carbon Footprint: " + result["Estimated Carbon Footprint (kg CO₂e)"] + " kg CO₂e";
            })
            .catch(error => console.error("Error:", error));
        }
    </script>

</body>
</html>
