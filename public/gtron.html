<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 1.5 Chatbot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #e0e0e0;
        }
        .chat-container {
            width: 90%;
            max-width: 500px;
            height: 80vh;
            background-color: #1e1e1e;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3), 0 4px 8px rgba(0, 150, 255, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #333;
        }
        .chat-header {
            background: linear-gradient(135deg, #0062ff, #0096ff);
            color: white;
            padding: 18px;
            text-align: center;
            font-weight: bold;
            font-size: 1.3rem;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid #0062ff;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #1e1e1e;
        }
        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #0062ff, #0096ff);
            color: white;
            border-bottom-right-radius: 6px;
        }
        .bot-message {
            align-self: flex-start;
            background-color: #2a2a2a;
            color: #e0e0e0;
            border-bottom-left-radius: 6px;
            border-left: 3px solid #0096ff;
        }
        .chat-input {
            display: flex;
            padding: 16px;
            border-top: 1px solid #333;
            background-color: #252525;
        }
        #user-input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid #444;
            border-radius: 24px;
            outline: none;
            font-size: 1rem;
            background-color: #2a2a2a;
            color: #e0e0e0;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        #user-input:focus {
            border-color: #0096ff;
            box-shadow: 0 0 0 2px rgba(0, 150, 255, 0.2);
        }
        #send-btn {
            margin-left: 12px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #0062ff, #0096ff);
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #send-btn:hover {
            background: linear-gradient(135deg, #0057e5, #0086e5);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0, 100, 255, 0.3);
        }
        #send-btn:active {
            transform: translateY(1px);
        }
        .typing-indicator {
            align-self: flex-start;
            color: #878787;
            font-style: italic;
            padding: 8px 16px;
            display: none;
            background-color: #2a2a2a;
            border-radius: 12px;
        }
        .error-message {
            color: #ff4d4d;
            padding: 10px;
            text-align: center;
            background-color: rgba(255, 77, 77, 0.1);
            border-radius: 8px;
            margin: 5px 0;
        }
        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #0096ff;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            G-Tron Chatbot
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message bot-message">
                Hello! I'm your G-Tron assistant. How can I help you today?
            </div>
            <div class="typing-indicator" id="typing-indicator">
                G-Tron is typing...
            </div>
        </div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        // DOM elements
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');
        
     
        // Model name - using the recommended model
        const MODEL_NAME = 'gemini-1.5-flash';
        
        // Add message to chat
        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            messageDiv.classList.add(role === 'user' ? 'user-message' : 'bot-message');
            messageDiv.textContent = content;
            chatMessages.insertBefore(messageDiv, typingIndicator);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Display error message
        function displayError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            chatMessages.appendChild(errorDiv);
        }

        // Get response directly from Gemini API
        async function getGeminiResponse(prompt) {
            typingIndicator.style.display = 'block';
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            try {
                // System prompt to specialize in e-waste and recycling
                const systemPrompt = `You are G-Tron, a specialized AI assistant focused on electronic waste (e-waste) management and recycling. 
                Your expertise includes:
                - E-waste classification and categorization
                - Recycling processes and best practices
                - Environmental impact of e-waste
                - E-waste regulations and compliance
                - Sustainable disposal methods
                - Material recovery from e-waste
                - E-waste collection and sorting
                
                If a question is not related to e-waste or recycling, politely inform the user that you specialize in e-waste topics and suggest they ask about e-waste management instead.
                
                User's question: ${prompt}`;

                // Direct call to the Gemini 1.5 Flash model
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/${MODEL_NAME}:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: systemPrompt
                            }]
                        }]
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`API Error: ${errorData.error?.message || response.statusText}`);
                }
                
                const data = await response.json();
                console.log('API response:', data);
                
                // Check if the API returned content
                if (data.candidates && data.candidates.length > 0 && 
                    data.candidates[0].content && 
                    data.candidates[0].content.parts && 
                    data.candidates[0].content.parts.length > 0) {
                    return data.candidates[0].content.parts[0].text;
                } else {
                    return "I received your message, but I'm having trouble generating a response. Please try again.";
                }
                
            } catch (error) {
                console.error('API Error:', error);
                return `Sorry, I'm having trouble responding: ${error.message}`;
            } finally {
                typingIndicator.style.display = 'none';
            }
        }

        // Send message event
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
            
            addMessage('user', message);
            userInput.value = '';
            
            const aiResponse = await getGeminiResponse(message);
            addMessage('bot', aiResponse);
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        
        // Log initialization
        console.log(`Gemini chatbot initialized with ${MODEL_NAME} model`);
    </script>
</body>
</html>
